[build]
# Explicitly use nixpacks, not Dockerfile
nixpkgs.rev = "nixos-24.05"

[phases.installPhp]
# Install PHP 8.3 with required extensions
nixpkgs = ["php83", "php83Extensions.gd", "php83Extensions.pdo", "php83Extensions.pdo_pgsql", "php83Extensions.pdo_mysql", "php83Extensions.bcmath", "php83Extensions.curl", "php83Extensions.mbstring", "php83Extensions.xml", "php83Extensions.zip", "composer"]

[phases.build]
dependsOn = ["installPhp"]
cmds = [
  "composer install --no-interaction --optimize-autoloader --no-dev"
]

[start]
cmd = "sh -lc \"php -S 0.0.0.0:${PORT:-8080} -t public/\""
